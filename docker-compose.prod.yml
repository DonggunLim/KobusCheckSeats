# Reference copy of /srv/kobusCheckSeats/docker-compose.yml on node-01 (operator-owned; CI no longer
# downloads it). homeserver-deploy writes KOBUS_APP_IMAGE / KOBUS_WORKER_IMAGE (same commit SHA) into
# the project's .env, so plain `docker compose` commands there always match the deployment record.
services:
  # Next.js 앱 (프로덕션)
  app:
    image: ${KOBUS_APP_IMAGE:?KOBUS_APP_IMAGE is set in .env by homeserver-deploy}
    container_name: kobus-app
    command: ["./entrypoint.app.sh"]
    environment:
      - NODE_ENV=production
      - TZ=Asia/Seoul
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=${REDIS_HOST:-redis-queue}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - GITHUB_REPOSITORY=${GITHUB_REPOSITORY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TELEGRAM_REQUESTER_LABEL=${TELEGRAM_REQUESTER_LABEL}
    # home-network: 프록시 접속, home-data: MySQL·Redis 전용 망
    networks:
      - home-network
      - home-data
    mem_limit: 512m
    pids_limit: 256
    restart: always

  # Worker (프로덕션)
  # Number of workers: KOBUS_WORKER_REPLICAS in .env (default 1).
  worker:
    image: ${KOBUS_WORKER_IMAGE:?KOBUS_WORKER_IMAGE is set in .env by homeserver-deploy}
    deploy:
      replicas: ${KOBUS_WORKER_REPLICAS:-1}
    command: ["./entrypoint.worker.sh"]
    environment:
      - NODE_ENV=production
      - TZ=Asia/Seoul
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=${REDIS_HOST:-redis-queue}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TELEGRAM_REQUESTER_LABEL=${TELEGRAM_REQUESTER_LABEL}
    # 웹 요청을 받지 않으므로 MySQL·Redis 전용 망에만 연결
    networks:
      - home-data
    mem_limit: 768m
    pids_limit: 512
    restart: always

networks:
  home-network:
    external: true # 기존에 생성된 외부 네트워크 사용
  home-data:
    external: true # MySQL·Redis 전용 망 (node-01에서 생성)

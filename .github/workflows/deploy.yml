name: Verify, publish and deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - run: npm test
      - name: Build
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: "true"

  # The app and worker images are built from the same commit and carry the same SHA tag:
  # the server pulls both and checks their revision labels before deploying.
  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: App image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod-app
          push: ${{ env.PUBLISH == 'true' }}
          tags: ghcr.io/donggunlim/kobuscheckseat-app:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: |
            type=gha,scope=app
            type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=app
      - name: Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod-worker
          push: ${{ env.PUBLISH == 'true' }}
          tags: ghcr.io/donggunlim/kobuscheckseat-worker:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: |
            type=gha,scope=worker
            type=gha,scope=app
          cache-to: type=gha,mode=max,scope=worker

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    concurrency:
      group: kobuscheckseats-production
      cancel-in-progress: false
    permissions:
      packages: read
    steps:
      - name: Deploy ${{ github.sha }}
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o BatchMode=yes -p 18075 donggun@ssh.toim.me "deploy $GITHUB_SHA"
